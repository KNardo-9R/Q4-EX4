<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>EX#4: JavaScript Switch Statements</title>

	<!--B5 SETUP-->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

	<!-- JS SETUP -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

	<!-- CSS SETUP -->
	<link rel="stylesheet" type="text/css" href="style.css">

	<!-- ANIMATION SETUP -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>

	<div class="container">
		<div class="header"><h2>Library Section</h2></div>
		<br>
			<div class="container2">
				<form>
					<label>Enter Section:</label>
					<input type="text" id="library-section" placeholder="Enter F, N, or R">
				</form>
				<br>
					<p id="result-section"></p>
			</div>

		<button type="button" class="btn btn-secondary" id="check-libsec" onClick="checkLibrarySec()">CHECK</button>
		<button type="button" class="btn btn-secondary" onClick="window.location.reload()">REFRESH</button>
	</div>

	<div class="container">
		<div class="header"><h2>Grade 9 Section Checker</h2></div>
		<br>
			<div class="container2">
				<details ontoggle="alert('Enter 1-Emerald, 2-Ruby, 3-Sapphire, 4-Topaz')"> 
					<summary>
						INSTRUCTION
					</summary>
				</details>
				<br>

				<form>
					<label>Enter a number:</label>
					<input type="number" id="class-section" placeholder="Enter 1,  2, 3, or 4">
				</form>
				<br>

				<p id="result-class-section"></p>
			</div>

			<button type="button" class="btn btn-secondary" id="check-classsec" onClick="checkClassSec()">CHECK</button>
			<button type="button" class="btn btn-secondary" onClick="window.location.reload()">REFRESH</button>
	</div><br> 

	<p><a href="https://knardo-9r.github.io/Q2EX2/">&#169; AY 2025 | ICT 9-Ruby | Kaitlyn Nardo</a></p>

	<script>
		function checkLibrarySec(){

			var section = document.getElementById('library-section').value;

		// match the var name to the parenthesis
			switch(section){
			case"F":
				document.getElementById('result-section').innerHTML = "The section is categorized as fiction.";
			break;

			case"N":
				document.getElementById('result-section').innerHTML = "The section is categorized as non-fiction.";
			break;

			case"R":
				document.getElementById('result-section').innerHTML = "The section is categorized as reference.";
			break;

			default:
			document.getElementById('result-section').innerHTML = "Error. Try again.";
			}
		}

		function checkClassSec(){

			var classSec = document.getElementById('class-section').value;

			switch(classSec){
			case '1': 
				document.getElementById('result-class-section').innerHTML = "You are from Emerald.";
			break;

			case '2': 
				document.getElementById('result-class-section').innerHTML = "You are from Ruby.";
			break;

			case '3':
				document.getElementById('result-class-section').innerHTML = "You are from Sapphire.";
			break; 

			case '4':
				document.getElementById('result-class-section').innerHTML = "You are from Topaz.";
			break; 

			default:
			document.getElementById('result-class-section').innerHTML = "Error. Try again.";
			}
		}
	</script>
</body>
</html>
